# Lean single-container Airflow 3 (api-server + scheduler + dag-processor via `standalone`).
# Run with: docker compose --env-file ../.env -f docker-compose.yaml up -d --build
services:
  airflow:
    build: .
    image: parcel-airflow:3.0.6
    user: "1000:0"
    command: standalone
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: ${PROJECT_DIR}/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/passwords.json
      MLFLOW_TRACKING_URI: http://host.docker.internal:5000
      PROJECT_DIR: ${PROJECT_DIR}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: "*"
    volumes:
      - ${A3_DIR}:${A3_DIR}
      - ./passwords.json:/opt/airflow/passwords.json:ro
      - airflow-home:/opt/airflow
    mem_limit: 2g

volumes:
  airflow-home:
