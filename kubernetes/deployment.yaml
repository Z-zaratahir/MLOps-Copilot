apiVersion: apps/v1
kind: Deployment
metadata:
  name: parcel-delay-api
  namespace: parcel-ml
  labels:
    app: parcel-delay-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parcel-delay-api
  template:
    metadata:
      labels:
        app: parcel-delay-api
        app.kubernetes.io/version: "1.0.0"
    spec:
      containers:
        - name: api
          image: parcel-delay-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: parcel-delay-config
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
