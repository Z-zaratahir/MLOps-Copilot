[project]
name = "parcel-ops-copilot"
version = "0.1.0"
description = "Conversational MLOps agent over DVC, MLflow, Airflow 3 and Kubernetes for a parcel-delay model"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "mlflow>=2.17",
    "dvc>=3.55",
    "kubernetes>=31.0",
    "groq>=0.13",
    "google-genai>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prompt/description strings are intentional

[tool.ruff.lint.per-file-ignores]
"training/stages.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
